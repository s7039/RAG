# 首次运行前先准备环境变量文件：cp .env.example .env
services:
  api:
    build: .
    image: rag-api:dev
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false        # .env 不入库；没有时用默认配置（离线模拟 + 本地向量）
    volumes:
      - rag_data:/app/data
    environment:
      POSTGRES_DSN: postgresql+psycopg://rag:rag@db:5432/rag
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ["5432:5432"]
    volumes:
      - rag_pg:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      retries: 20

volumes:
  rag_data:
  rag_pg:
