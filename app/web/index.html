<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>健康档案 · 私有知识库 RAG</title>
<style>
  :root {
    --bg: #f4f7f7;
    --panel: #ffffff;
    --ink: #10201f;
    --muted: #6b7c7a;
    --line: #dfe8e6;
    --accent: #0f766e;
    --accent-soft: #e6f4f1;
    --warn: #b45309;
    --warn-soft: #fef3c7;
    --user: #0f766e;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16, 32, 31, .05), 0 8px 24px rgba(16, 32, 31, .06);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.65;
    display: flex;
    flex-direction: column;
  }
  header {
    height: 60px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 15px; }
  .logo {
    width: 28px; height: 28px; border-radius: 9px;
    background: linear-gradient(135deg, #0f766e, #14b8a6);
    display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700;
  }
  .sub { color: var(--muted); font-size: 12px; font-weight: 400; }
  .badges { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px; background: #f1f5f4;
    border: 1px solid var(--line); color: #37514e; font-size: 12px; white-space: nowrap;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #10b981; }
  .dot.mock { background: #f59e0b; }
  .dot.off { background: #cbd5d4; }

  main { flex: 1 1 auto; display: flex; min-height: 0; }
  aside {
    width: 300px; flex: 0 0 auto; border-right: 1px solid var(--line);
    background: var(--panel); padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px;
  }
  .card-title { font-size: 12px; font-weight: 650; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; margin: 0 0 10px; }
  .doc {
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: #fbfdfd;
  }
  .doc-name { font-weight: 600; font-size: 13px; word-break: break-all; }
  .doc-meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .tag { display: inline-block; background: var(--accent-soft); color: #0b5d57; border-radius: 6px; padding: 0 6px; font-size: 11px; margin: 3px 4px 0 0; }
  label.field { display: block; margin-bottom: 12px; font-size: 12px; color: var(--muted); }
  label.field span { display: block; margin-bottom: 4px; }
  select, input[type="text"], textarea, input[type="number"] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px;
    background: #fff; color: var(--ink); font-family: inherit; font-size: 13px; outline: none;
  }
  select:focus, input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15,118,110,.1); }
  .row { display: flex; align-items: center; gap: 8px; }
  .row input[type="range"] { flex: 1; accent-color: var(--accent); }
  .row b { font-variant-numeric: tabular-nums; min-width: 16px; text-align: right; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink); margin-bottom: 12px; }
  .check input { accent-color: var(--accent); }
  button {
    font-family: inherit; font-size: 13px; border-radius: 9px; border: 1px solid var(--line);
    background: #fff; color: var(--ink); padding: 8px 12px; cursor: pointer; transition: .15s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: #0b5d57; color: #fff; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  button.block { width: 100%; }

  .chat { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1 1 auto; overflow-y: auto; padding: 26px 8%; scroll-behavior: smooth; }
  .msg { display: flex; margin-bottom: 20px; gap: 10px; }
  .msg .avatar {
    width: 30px; height: 30px; border-radius: 9px; flex: 0 0 auto; display: grid; place-items: center;
    font-size: 12px; font-weight: 700; color: #fff; background: #94a3b8;
  }
  .msg.bot .avatar { background: linear-gradient(135deg, #0f766e, #14b8a6); }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { background: #334155; }
  .bubble { max-width: 88%; }
  .msg.user .bubble {
    background: var(--user); color: #fff; padding: 10px 14px; border-radius: 12px 12px 4px 12px;
  }
  .msg.bot .bubble {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px 12px 12px 4px;
    padding: 12px 16px; box-shadow: var(--shadow);
  }
  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 6px 0; padding-left: 20px; }
  .bubble code { background: #eef2f1; padding: 1px 5px; border-radius: 5px; font-size: 12px; }
  .bubble pre { background: #0f1c1b; color: #d7e3e1; padding: 10px 12px; border-radius: 9px; overflow-x: auto; }
  .bubble table { border-collapse: collapse; margin: 8px 0; font-size: 12.5px; width: 100%; }
  .bubble th, .bubble td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
  .bubble th { background: var(--accent-soft); color: #0b5d57; font-weight: 600; }
  .bubble tbody tr:nth-child(even) { background: #fafcfc; }
  .cite {
    display: inline-block; min-width: 16px; text-align: center; background: var(--accent-soft); color: #0b5d57;
    border-radius: 5px; font-size: 11px; padding: 0 4px; margin: 0 1px; cursor: pointer; border: 1px solid #c8e6e1;
    vertical-align: 1px;
  }
  .cite:hover { background: #cfeeea; }
  .sources { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
  .sources summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  .src { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; margin-top: 8px; background: #fbfdfd; }
  .src-head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .src-no { background: var(--accent); color: #fff; border-radius: 5px; padding: 0 6px; font-weight: 600; }
  .src-score { margin-left: auto; font-variant-numeric: tabular-nums; }
  .src-body { font-size: 12.5px; margin-top: 6px; color: #33474a; white-space: pre-wrap; word-break: break-word; max-height: 150px; overflow-y: auto; }
  .src.flash { animation: flash 1.2s ease; }
  @keyframes flash { 0% { background: #fff7d6; border-color: #f0c96b; } 100% { background: #fbfdfd; } }
  .meta-line { font-size: 11.5px; color: var(--muted); margin-top: 8px; display: flex; gap: 10px; flex-wrap: wrap; }
  .warn {
    background: var(--warn-soft); color: var(--warn); border: 1px solid #f3d9a4;
    padding: 7px 10px; border-radius: 9px; font-size: 12px; margin-top: 8px;
  }
  .placeholder { display: grid; place-items: center; height: 100%; color: var(--muted); text-align: center; }
  .placeholder h2 { font-size: 18px; color: var(--ink); margin: 0 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .chip {
    border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 14px;
    font-size: 13px; cursor: pointer; color: #33504d;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .composer { flex: 0 0 auto; padding: 12px 8% 18px; background: linear-gradient(180deg, rgba(244,247,247,0), var(--bg) 40%); }
  .composer form {
    display: flex; gap: 10px; align-items: flex-end; background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; box-shadow: var(--shadow);
  }
  .composer textarea {
    border: none; resize: none; max-height: 160px; min-height: 24px; padding: 8px 6px; box-shadow: none; background: transparent;
  }
  .composer textarea:focus { box-shadow: none; border: none; }
  .hint { text-align: center; color: #94a3a2; font-size: 11.5px; margin-top: 8px; }
  .typing { display: inline-flex; gap: 3px; }
  .typing i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
  @media (max-width: 900px) {
    aside { display: none; }
    #messages { padding: 16px; }
    .composer { padding: 10px 12px 14px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">健</div>
    <div>
      健康档案 · 私有知识库 RAG
      <div class="sub">LangChain · FastAPI · OpenAI / DeepSeek · Chroma</div>
    </div>
  </div>
  <div class="badges" id="badges">
    <span class="badge"><span class="dot" id="dot-llm"></span><span id="badge-mode">加载中…</span></span>
    <span class="badge" id="badge-chunks">知识库 — 片段</span>
    <span class="badge" id="badge-embed">向量 —</span>
  </div>
</header>

<main>
  <aside>
    <div>
      <h3 class="card-title">知识库文档</h3>
      <div id="docs"><div class="doc-meta">加载中…</div></div>
      <button class="block" id="btn-ingest" style="margin-top:10px">重新灌库</button>
    </div>

    <div>
      <h3 class="card-title">检索 / 生成参数</h3>
      <label class="field"><span>大模型供应商</span>
        <select id="provider"></select>
      </label>
      <label class="field"><span>模型</span>
        <select id="model"></select>
      </label>
      <label class="field"><span>召回数量 top_k</span>
        <div class="row"><input type="range" id="topk" min="1" max="10" value="4" /><b id="topk-val">4</b></div>
      </label>
      <label class="field"><span>患者筛选</span>
        <select id="patient"><option value="">全部患者</option></select>
      </label>
      <label class="check"><input type="checkbox" id="mmr" /> 启用 MMR 去重重排</label>
    </div>

    <div style="margin-top:auto; color:#94a3a2; font-size:11.5px">
      离线：加载 → 切分 → 向量化 → 入库<br />
      在线：问题向量化 → 检索 → Prompt → LLM
    </div>
  </aside>

  <section class="chat">
    <div id="messages">
      <div class="placeholder" id="placeholder">
        <div>
          <h2>私域健康档案问答</h2>
          <div>所有回答均基于 input/ 目录下的健康档案检索生成</div>
          <div class="chips">
            <div class="chip">张三九的空腹血糖是多少？</div>
            <div class="chip">李四六对哪些药物或食物过敏？</div>
            <div class="chip">王五的既往病史和手术史有哪些？</div>
            <div class="chip">张三九的体检结果有哪些指标异常？</div>
          </div>
        </div>
      </div>
    </div>

    <div class="composer">
      <form id="form">
        <textarea id="input" rows="1" placeholder="询问健康档案中的信息，例如：张三九最近的血压和血糖情况怎么样？"></textarea>
        <button class="primary" id="send" type="submit">发送</button>
      </form>
      <div class="hint">回答由大模型基于检索结果生成，仅供参考，不能替代医生诊断</div>
    </div>
  </section>
</main>

<script>
const $ = (sel) => document.querySelector(sel);
const state = { providers: [], docs: [], busy: false };

function esc(text) {
  return String(text ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// 轻量 Markdown 渲染：加粗、行内代码、列表、表格、引用编号
function render(text) {
  const lines = esc(text).split("\n");
  let html = "", inList = false, listTag = "ul", table = [];
  const inline = (s) => s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[(\d+)\]/g, '<span class="cite" data-cite="$1">[$1]</span>');

  const flushTable = () => {
    if (!table.length) return;
    const rows = table
      .filter((row) => !/^\|[\s|:-]+\|$/.test(row))
      .map((row) => row.replace(/^\||\|$/g, "").split("|").map((c) => c.trim()));
    table = [];
    if (!rows.length) return;
    const [head, ...body] = rows;
    html += "<table><thead><tr>" + head.map((c) => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>" +
      body.map((r) => "<tr>" + r.map((c) => `<td>${inline(c)}</td>`).join("") + "</tr>").join("") +
      "</tbody></table>";
  };

  for (const raw of lines) {
    const line = raw.trim();
    if (line.startsWith("|") && line.endsWith("|") && line.length > 2) {
      if (inList) { html += `</${listTag}>`; inList = false; }
      table.push(line);
      continue;
    }
    flushTable();
    const olMatch = line.match(/^(\d+)[.、]\s+(.*)$/);
    const ulMatch = line.match(/^[-*]\s+(.*)$/);
    if (olMatch || ulMatch) {
      const tag = olMatch ? "ol" : "ul";
      if (!inList || listTag !== tag) {
        if (inList) html += `</${listTag}>`;
        html += `<${tag}>`; inList = true; listTag = tag;
      }
      html += `<li>${inline(olMatch ? olMatch[2] : ulMatch[1])}</li>`;
      continue;
    }
    if (inList) { html += `</${listTag}>`; inList = false; }
    if (!line) { html += "<br />"; continue; }
    html += `<p>${inline(line)}</p>`;
  }
  flushTable();
  if (inList) html += `</${listTag}>`;
  return html;
}

async function api(path, options = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  if (!res.ok) {
    let msg = res.statusText;
    try { const body = await res.json(); msg = body.detail || JSON.stringify(body); } catch (_) {}
    throw new Error(msg);
  }
  return res.json();
}

// ---------------------------------------------------------------- 状态
async function loadStatus() {
  try {
    const data = await api("/api/status");
    const d = data.data;
    $("#badge-chunks").textContent = `知识库 ${d.chunks} 片段`;
    $("#badge-embed").textContent = `向量 ${d.embedding.provider}/${d.embedding.model || "-"}`;
    const docs = d.documents || [];
    state.docs = docs;
    const box = $("#docs");
    box.innerHTML = docs.length
      ? docs.map((x) => `
        <div class="doc">
          <div class="doc-name">${esc(x.doc_title || x.source)}</div>
          <div class="doc-meta">${esc(x.source)} · ${x.chunks} 片段${x.pages ? " · 第" + esc(x.pages) + "页" : ""}</div>
          <div>${(x.patients || []).map((p) => `<span class="tag">${esc(p)}</span>`).join("")}</div>
        </div>`).join("")
      : `<div class="doc-meta">尚未灌库，点击下方按钮重建。</div>`;

    const patients = [...new Set(docs.flatMap((x) => x.patients || []))];
    const select = $("#patient");
    const current = select.value;
    select.innerHTML = `<option value="">全部患者</option>` + patients.map((p) => `<option value="${esc(p)}">${esc(p)}</option>`).join("");
    select.value = patients.includes(current) ? current : "";
  } catch (err) {
    $("#docs").innerHTML = `<div class="doc-meta">状态加载失败：${esc(err.message)}</div>`;
  }
}

async function loadProviders() {
  try {
    const data = await api("/api/providers");
    state.providers = data.data.providers.filter((p) => p.key !== "mock" && (p.key !== "custom" || p.available));
    const select = $("#provider");
    select.innerHTML = state.providers
      .map((p) => `<option value="${esc(p.key)}" ${p.available ? "" : "data-off=1"}>${esc(p.label)}${p.available ? "" : "（未配置 Key）"}</option>`)
      .join("") + `<option value="mock">离线模拟模型</option>`;
    const preferred = data.data.default_provider;
    if ([...select.options].some((o) => o.value === preferred)) select.value = preferred;
    updateModels();

    const mock = data.data.mock_active;
    $("#dot-llm").className = "dot" + (mock ? " mock" : "");
    $("#badge-mode").textContent = mock ? "离线模拟模式" : "大模型已就绪";
  } catch (err) {
    $("#badge-mode").textContent = "模型加载失败";
  }
}

function updateModels() {
  const key = $("#provider").value;
  const modelSelect = $("#model");
  if (key === "mock") {
    modelSelect.innerHTML = `<option value="offline-extractive">offline-extractive</option>`;
    return;
  }
  const provider = state.providers.find((p) => p.key === key);
  const models = provider ? provider.chat_models : [];
  modelSelect.innerHTML = models.map((m) => `<option value="${esc(m)}">${esc(m)}</option>`).join("");
  modelSelect.disabled = !models.length;
}

// ---------------------------------------------------------------- 渲染消息
function addUserMessage(text) {
  $("#placeholder")?.remove();
  const el = document.createElement("div");
  el.className = "msg user";
  el.innerHTML = `<div class="avatar">我</div><div class="bubble">${esc(text)}</div>`;
  $("#messages").appendChild(el);
  scrollBottom();
}

function addBotShell() {
  const el = document.createElement("div");
  el.className = "msg bot";
  el.innerHTML = `
    <div class="avatar">AI</div>
    <div class="bubble">
      <div class="answer"><span class="typing"><i></i><i></i><i></i></span></div>
      <div class="sources" hidden>
        <details open><summary>检索到的资料（0）</summary><div class="src-list"></div></details>
      </div>
      <div class="meta-line"></div>
      <div class="warn" hidden></div>
    </div>`;
  $("#messages").appendChild(el);
  scrollBottom();
  return el;
}

function renderSources(el, sources) {
  const wrap = el.querySelector(".sources");
  const list = el.querySelector(".src-list");
  if (!sources?.length) { wrap.hidden = true; return; }
  wrap.hidden = false;
  el.querySelector("summary").textContent = `检索到的资料（${sources.length}）`;
  list.innerHTML = sources.map((s, i) => {
    const where = [s.source, s.page ? `第${s.page}页` : "", s.section].filter(Boolean).join(" · ");
    return `<div class="src" id="src-${i + 1}">
      <div class="src-head">
        <span class="src-no">${s.rank}</span>
        <span>${esc(where)}</span>
        ${s.patient ? `<span class="tag">${esc(s.patient)}</span>` : ""}
        <span class="src-score">相似度 ${Number(s.score).toFixed(3)}</span>
      </div>
      <div class="src-body">${esc(s.content)}</div>
    </div>`;
  }).join("");
  // 点击正文里的 [n] 定位到对应资料
  el.querySelectorAll(".cite").forEach((node) => {
    node.addEventListener("click", () => {
      const target = el.querySelector(`#src-${node.dataset.cite}`);
      if (!target) return;
      target.scrollIntoView({ behavior: "smooth", block: "nearest" });
      target.classList.remove("flash");
      void target.offsetWidth;
      target.classList.add("flash");
    });
  });
}

function scrollBottom() {
  const box = $("#messages");
  box.scrollTop = box.scrollHeight;
}

// ---------------------------------------------------------------- 发送
async function send(question) {
  if (!question.trim() || state.busy) return;
  state.busy = true;
  $("#send").disabled = true;
  addUserMessage(question);

  const el = addBotShell();
  const answerBox = el.querySelector(".answer");
  let text = "";
  let meta = null;

  const payload = {
    question,
    top_k: Number($("#topk").value),
    use_mmr: $("#mmr").checked,
  };
  const provider = $("#provider").value;
  if (provider && provider !== "mock") payload.provider = provider;
  if (provider === "mock") payload.provider = "mock";
  const model = $("#model").value;
  if (model && provider !== "mock") payload.model = model;
  const patient = $("#patient").value;
  if (patient) payload.patient = patient;

  try {
    const res = await fetch("/api/query/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok || !res.body) throw new Error(`HTTP ${res.status}`);

    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buffer = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split("\n\n");
      buffer = parts.pop();
      for (const part of parts) {
        if (!part.trim()) continue;
        let event = "message", data = "";
        for (const line of part.split("\n")) {
          if (line.startsWith("event:")) event = line.slice(6).trim();
          else if (line.startsWith("data:")) data += line.slice(5).trim();
        }
        if (!data) continue;
        const payloadData = JSON.parse(data);

        if (event === "retrieval") {
          renderSources(el, payloadData.sources || []);
          meta = payloadData;
          if (payloadData.warnings?.length) showWarnings(el, payloadData.warnings);
        } else if (event === "token") {
          text += payloadData.text || "";
          answerBox.innerHTML = render(text);
        } else if (event === "done") {
          const p = payloadData.provider || {};
          el.querySelector(".meta-line").innerHTML =
            `<span>${esc(p.provider_label || p.provider || "")}</span><span>${esc(p.model || "")}</span>` +
            `<span>${esc(payloadData.mode === "mock" ? "离线模拟" : "大模型生成")}</span>` +
            `<span>${payloadData.timings_ms?.total ?? "?"} ms</span>`;
        } else if (event === "error") {
          throw new Error(payloadData.message || "生成失败");
        }
      }
    }
    if (!text) answerBox.innerHTML = `<p>（未返回内容）</p>`;
  } catch (err) {
    answerBox.innerHTML = `<p style="color:#b91c1c">请求失败：${esc(err.message)}</p>`;
  } finally {
    state.busy = false;
    $("#send").disabled = false;
    scrollBottom();
  }
}

function showWarnings(el, warnings) {
  const box = el.querySelector(".warn");
  if (!box) return;
  box.hidden = false;
  box.innerHTML = warnings.map((w) => `<div>⚠️ ${esc(w)}</div>`).join("");
}

// ---------------------------------------------------------------- 事件绑定
$("#form").addEventListener("submit", (e) => {
  e.preventDefault();
  const value = $("#input").value;
  $("#input").value = "";
  $("#input").style.height = "auto";
  send(value);
});

$("#input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("#form").requestSubmit();
  }
});
$("#input").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 160) + "px";
});

$("#topk").addEventListener("input", (e) => ($("#topk-val").textContent = e.target.value));
$("#provider").addEventListener("change", updateModels);

$("#btn-ingest").addEventListener("click", async () => {
  const btn = $("#btn-ingest");
  btn.disabled = true;
  btn.textContent = "灌库中…";
  try {
    const data = await api("/api/ingest", { method: "POST", body: JSON.stringify({ reset: true }) });
    const s = data.stats || {};
    btn.textContent = `完成：${s.chunks || 0} 片段`;
    await loadStatus();
  } catch (err) {
    btn.textContent = "灌库失败";
    alert("灌库失败：" + err.message);
  } finally {
    setTimeout(() => { btn.disabled = false; btn.textContent = "重新灌库"; }, 2000);
  }
});

document.querySelectorAll(".chip").forEach((chip) => {
  chip.addEventListener("click", () => {
    const q = chip.textContent.trim();
    $("#input").value = q;
    send(q);
  });
});

loadStatus();
loadProviders();
</script>
</body>
</html>
