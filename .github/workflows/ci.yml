name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U rag -d rag"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt ruff
      - name: 建表（documents/chunks/tasks/sessions/messages/user_prefs）
        run: |
          python -c "import pathlib, psycopg; conn = psycopg.connect('postgresql://rag:rag@localhost:5432/rag'); conn.execute(pathlib.Path('db/init.sql').read_text(encoding='utf-8')); conn.commit()"
      - name: 静态检查（只看语法/未定义名，避免历史告警把 CI 打红）
        run: ruff check --select E9,F63,F7,F82 app tests evals
      - name: 单元测试
        run: python -m pytest
      - name: 灌库（评测需要 58 个 chunk）
        run: python scripts/ingest.py
      - name: 离线评测
        run: python -m evals.runner
